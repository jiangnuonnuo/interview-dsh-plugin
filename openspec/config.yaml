schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: TypeScript (backend) + TypeScript + React (frontend)
  Runtime: DSH (DeepSeek Harness) plugin environment
  We use Conventional Commits for git
  Domain: interview-dsh plugin for interview assistance / workflow management
  Current state: empty project, scaffolding from scratch

  Core constraints from Agent.md:
  - Backend: TypeScript strict mode, Node.js / DSH runtime, prefer official DSH SDK/API, async/await, explicit error handling, no bare JS, no hardcoded secrets
  - Frontend: TypeScript + React, functional components + hooks, CSS Modules/Tailwind, prefer DSH UI components, no implicit any
  - Structure: backend/ and frontend/ separated, follow DSH plugin standard layout
  - Security: encrypt interview data at rest/in transit, no frontend handling of backend sensitive logic
  - Stability: avoid risky async ops during active interviews; plugin config must support reload/hot-update
  - Dependencies: only validated deps; do not modify DSH core/runtime beyond allowed hooks
  - Agent rules: confirm paths before creating files; read context before editing; add types/comments; mark unknowns as TODO

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Always include a "Non-goals" section
    - Keep proposals under 500 words
    - Call out backend API contracts and any DSH runtime assumptions
  specs:
    - Deltas only; do not restate the entire existing system
    - Include explicit acceptance criteria for TS/React boundaries
  design:
    - Separate backend and frontend responsibilities clearly
    - Note security-sensitive flows (encryption, auth, secrets)
  tasks:
    - Break tasks into chunks of max 2 hours
    - Tag each task with backend/frontend/infra when applicable

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Prefer scaffolding backend/ first, then frontend/
      - Do not modify DSH core files outside plugin boundaries
      - Keep test summaries concise
  archive:
    guidance:
      - Summarize the archive outcome before finishing
